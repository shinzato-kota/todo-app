spring.application.name=todo-app

# どのアプリケーションかをURLで示すためにコンテキストパスを設定する
server.servlet.context-path=/todo-app

# DB接続情報はGitHubに上げないため application-local.properties(.gitignore対象)に分離
spring.config.import=optional:file:./application-local.properties

# DBファースト方式のため、entityとテーブル定義の不一致を検知するvalidateのみ行う(自動生成はしない)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# 例外ハンドラーで処理していない例外でもスタックトレースを応答に含めない
# (開発ツールがalwaysに変更するため、明示的に上書きする。サーバーのログには出力される)
server.error.include-stacktrace=never
