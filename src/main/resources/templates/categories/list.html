<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/head :: head('カテゴリ一覧', 'list.css')}"
  ></head>
  <!--/* JavaScriptからAPIを呼ぶ際にコンテキストパスが必要になるため、HTML側から渡す */-->
  <body th:data-context-path="@{/}">
    <header th:replace="~{fragments/header :: appHeader}"></header>

    <h2>カテゴリ一覧</h2>

    <p>
      <a class="button button--primary" th:href="@{/categories/new}"
        >カテゴリ追加</a
      >
    </p>

    <div class="category-list">
      <p
        class="empty-message category-list__empty-message js-empty-message"
        th:hidden="${!#lists.isEmpty(categories)}"
      >
        カテゴリはありません
      </p>

      <table
        class="data-table category-list__table js-category-table"
        th:hidden="${#lists.isEmpty(categories)}"
      >
        <thead>
          <tr>
            <th class="data-table__header-cell">カテゴリ名</th>
            <th
              class="data-table__header-cell data-table__header-cell--align_center category-list__actions-cell"
            >
              操作
            </th>
          </tr>
        </thead>
        <tbody>
          <tr
            th:each="category : ${categories}"
            th:data-category-id="${category.id}"
          >
            <td class="data-table__cell">
              <span
                class="category-label"
                th:classappend="${category.color == null} ? 'category-label--no-color'"
              >
                <span
                  class="category-label__color"
                  aria-hidden="true"
                  th:style="${category.color != null} ? 'color: ' + ${category.color}"
                  >●</span
                >
                <span
                  class="category-label__name js-category-name"
                  th:text="${category.name}"
                  >カテゴリ名の表示位置</span
                >
              </span>
            </td>
            <td
              class="data-table__cell data-table__cell--align_center category-list__actions-cell"
            >
              <button
                type="button"
                class="row-action row-action--danger js-delete-button"
              >
                削除
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/categories.js}"></script>
  </body>
</html>
