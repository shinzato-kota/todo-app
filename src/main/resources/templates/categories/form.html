<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/head :: head('カテゴリ追加', 'form.css')}"
  ></head>
  <body>
    <header th:replace="~{fragments/header :: appHeader}"></header>

    <h2>カテゴリ追加</h2>

    <form
      class="form category-form js-form"
      method="post"
      th:object="${categoryForm}"
      th:action="@{/categories}"
    >
      <div class="form__field">
        <label class="form__label" for="name"
          >カテゴリ名 <span class="form__required">*必須</span></label
        >
        <input
          type="text"
          id="name"
          class="form__control category-form__name"
          th:field="*{name}"
          maxlength="20"
          required
        />
        <span
          class="form__error"
          th:if="${#fields.hasErrors('name')}"
          th:errors="*{name}"
          >エラーメッセージの表示位置</span
        >
      </div>

      <div class="form__field">
        <label class="form__label" for="color">ラベル色</label>
        <input type="color" id="color" th:field="*{color}" />
        <span class="form__checkbox-group">
          <input type="checkbox" id="noColor" th:field="*{noColor}" />
          <label for="noColor">色を付けない</label>
        </span>
        <span
          class="form__error"
          th:if="${#fields.hasErrors('color')}"
          th:errors="*{color}"
          >エラーメッセージの表示位置</span
        >
      </div>

      <div class="form__actions">
        <button type="submit" class="button button--primary js-save-button">
          保存
        </button>
        <a class="button button--secondary" th:href="@{/categories}"
          >キャンセル</a
        >
      </div>
    </form>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/js/form.js}"></script>
  </body>
</html>
