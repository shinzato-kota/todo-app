<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <!--/*
    例外ハンドラーで処理していないエラーのときに出す画面。
    利用者が次の操作を変えられないため、エラーの番号と例外の情報は出さない。
  */-->
  <head th:replace="~{fragments/head :: head('エラー', null)}"></head>
  <body>
    <header th:replace="~{fragments/header :: appHeader}"></header>

    <h2>エラーが発生しました</h2>

    <p>ページを表示できませんでした。</p>

    <p>
      <a class="button button--primary" th:href="@{/tasks}">タスク一覧へ戻る</a>
    </p>
  </body>
</html>
