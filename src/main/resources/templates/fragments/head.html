<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <!--
    全画面共通のhead要素。
    画面ごとに差し替わるのは、タイトルと画面専用のCSSの2箇所。
  -->
  <head th:fragment="head(pageTitle, pageCss)">
    <meta charset="UTF-8" />
    <title th:text="${pageTitle}">画面タイトル</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{'/css/' + ${pageCss}}" />
  </head>
</html>
