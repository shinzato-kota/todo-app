<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/head :: head(${taskForm.id} == null ? 'タスク追加' : 'タスク編集', 'form.css')}"
  ></head>
  <body>
    <header th:replace="~{fragments/header :: appHeader}"></header>

    <h2 th:text="${taskForm.id} == null ? 'タスク追加' : 'タスク編集'">
      タスク追加
    </h2>

    <form
      class="form task-form js-form"
      method="post"
      th:object="${taskForm}"
      th:action="${taskForm.id} == null ? @{/tasks} : @{/tasks/{id}(id=${taskForm.id})}"
    >
      <div class="form__field">
        <label class="form__label" for="title"
          >タイトル <span class="form__required">*必須</span></label
        >
        <input
          type="text"
          id="title"
          class="form__control task-form__title"
          th:field="*{title}"
          maxlength="100"
          required
        />
        <span
          class="form__error"
          th:if="${#fields.hasErrors('title')}"
          th:errors="*{title}"
          >エラーメッセージの表示位置</span
        >
      </div>

      <div class="form__field">
        <label class="form__label" for="description">詳細</label>
        <textarea
          id="description"
          class="form__control task-form__description"
          th:field="*{description}"
          rows="5"
          maxlength="2000"
        ></textarea>
        <span
          class="form__error"
          th:if="${#fields.hasErrors('description')}"
          th:errors="*{description}"
          >エラーメッセージの表示位置</span
        >
      </div>

      <div class="form__field">
        <label class="form__label" for="categoryId">カテゴリ</label>
        <select
          id="categoryId"
          class="form__control task-form__category"
          th:field="*{categoryId}"
        >
          <option value="">カテゴリなし</option>
          <option
            th:each="c : ${categories}"
            th:value="${c.id}"
            th:text="${c.name}"
          >
            カテゴリ
          </option>
        </select>
        <span
          class="form__error"
          th:if="${#fields.hasErrors('categoryId')}"
          th:errors="*{categoryId}"
          >エラーメッセージの表示位置</span
        >
      </div>

      <div class="form__field">
        <label class="form__label" for="priority">優先度</label>
        <select id="priority" class="form__control" th:field="*{priority}">
          <option
            th:each="p : ${priorities}"
            th:value="${p}"
            th:text="${p.displayName}"
          >
            優先度
          </option>
        </select>
        <span
          class="form__error"
          th:if="${#fields.hasErrors('priority')}"
          th:errors="*{priority}"
          >エラーメッセージの表示位置</span
        >
      </div>

      <div class="form__field">
        <label class="form__label" for="dueDate">期限</label>
        <input
          type="date"
          id="dueDate"
          class="form__control"
          th:field="*{dueDate}"
        />
        <span
          class="form__error"
          th:if="${#fields.hasErrors('dueDate')}"
          th:errors="*{dueDate}"
          >エラーメッセージの表示位置</span
        >
      </div>

      <div class="form__actions">
        <button type="submit" class="button button--primary js-save-button">
          保存
        </button>
        <a class="button button--secondary" th:href="@{/tasks}">キャンセル</a>
      </div>
    </form>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/js/form.js}"></script>
  </body>
</html>
