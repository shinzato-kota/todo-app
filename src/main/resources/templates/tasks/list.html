<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('タスク一覧', 'list.css')}"></head>
  <!--/* JavaScriptからAPIを呼ぶ際にコンテキストパスが必要になるため、HTML側から渡す */-->
  <!--/* 編集・保存でタスクが見つからなかったときの知らせを、JavaScriptでダイアログに出すため、HTML側から渡す */-->
  <body th:data-context-path="@{/}" th:data-alert-message="${alertMessage}">
    <header th:replace="~{fragments/header :: appHeader}"></header>

    <h2>タスク一覧</h2>

    <p>
      <a class="button button--primary" th:href="@{/tasks/new}">タスク追加</a>
    </p>

    <div class="task-list">
      <!--/* タスクが0件でも絞り込みの欄は出し、0件から1件になっても配置を変えない */-->
      <section class="task-filter task-list__filter" aria-label="絞り込み">
        <div class="task-filter__row js-filter-group" data-condition="status">
          <span class="task-filter__label">ステータス</span>
          <button
            type="button"
            class="filter-button filter-button--selected js-filter-button"
            data-value=""
            aria-pressed="true"
          >
            すべて
          </button>
          <button
            type="button"
            class="filter-button js-filter-button"
            th:each="s : ${statuses}"
            th:data-value="${s}"
            th:text="${s.displayName}"
            aria-pressed="false"
          >
            未着手
          </button>
        </div>
        <div class="task-filter__row js-filter-group" data-condition="due">
          <span class="task-filter__label">期限</span>
          <button
            type="button"
            class="filter-button filter-button--selected js-filter-button"
            data-value=""
            aria-pressed="true"
          >
            すべて
          </button>
          <button
            type="button"
            class="filter-button js-filter-button"
            data-value="DUE_TODAY"
            aria-pressed="false"
          >
            今日まで
          </button>
          <button
            type="button"
            class="filter-button js-filter-button"
            data-value="OVERDUE"
            aria-pressed="false"
          >
            期限切れのみ
          </button>
        </div>
        <div class="task-filter__row js-filter-group" data-condition="priority">
          <span class="task-filter__label">優先度</span>
          <button
            type="button"
            class="filter-button filter-button--selected js-filter-button"
            data-value=""
            aria-pressed="true"
          >
            すべて
          </button>
          <button
            type="button"
            class="filter-button js-filter-button"
            th:each="p : ${priorities}"
            th:data-value="${p}"
            th:text="${p.displayName}"
            aria-pressed="false"
          >
            中
          </button>
        </div>
        <div class="task-filter__row">
          <label class="task-filter__label" for="keyword">キーワード</label>
          <input
            type="search"
            id="keyword"
            class="task-filter__input js-keyword-input"
            maxlength="100"
            placeholder="タイトル・詳細から探す"
            autocomplete="off"
          />
        </div>
        <div class="task-filter__row">
          <label class="task-filter__label" for="category">カテゴリ</label>
          <select
            id="category"
            class="task-filter__input js-category-select"
            autocomplete="off"
          >
            <option value="" selected>すべて</option>
            <option value="NONE">カテゴリなし</option>
            <option
              th:each="category : ${categories}"
              th:value="${category.id}"
              th:text="${category.name}"
            >
              カテゴリ名
            </option>
          </select>
        </div>
      </section>

      <p
        class="empty-message task-list__empty-message js-empty-message"
        th:hidden="${!#lists.isEmpty(tasks)}"
      >
        タスクはありません
      </p>
      <p
        class="empty-message task-list__empty-message js-no-match-message"
        hidden
      >
        条件に合うタスクはありません
      </p>
      <p
        class="empty-message task-list__empty-message js-load-error-message"
        hidden
      >
        タスクを取得できませんでした。条件を変えるか、画面を再読み込みしてください。
      </p>

      <!--/* 絞り込みの有無で表の位置が変わらないよう、表があるときはいつも出し、中の文だけを切り替える */-->
      <p
        class="task-list__sort-notice js-sort-notice"
        th:hidden="${#lists.isEmpty(tasks)}"
      >
        <span class="js-sort-guide">≡をつかんで動かすと、並び替えられます</span>
        <span class="task-list__filter-notice js-filter-notice" hidden>
          絞り込み中は並び替えできません
        </span>
      </p>

      <table
        class="data-table task-list__table js-task-table"
        th:hidden="${#lists.isEmpty(tasks)}"
      >
        <thead>
          <tr>
            <th
              class="data-table__header-cell data-table__header-cell--align_center task-list__handle-cell"
            >
              順
            </th>
            <th class="data-table__header-cell">タイトル</th>
            <th class="data-table__header-cell task-list__category-cell">
              カテゴリ
            </th>
            <th
              class="data-table__header-cell data-table__header-cell--align_center task-list__priority-cell"
            >
              優先度
            </th>
            <th
              class="data-table__header-cell data-table__header-cell--align_center task-list__due-date-cell"
            >
              期限
            </th>
            <th
              class="data-table__header-cell data-table__header-cell--align_center task-list__status-cell"
            >
              ステータス
            </th>
            <th
              class="data-table__header-cell data-table__header-cell--align_center task-list__actions-cell"
            >
              操作
            </th>
          </tr>
        </thead>
        <!--/* 行を変えるときは、下の<template>の行も同じ形に変える */-->
        <tbody>
          <tr
            class="task-table-row"
            th:each="task : ${tasks}"
            th:with="statusValue=${#strings.toLowerCase(#strings.replace(task.status.name(), '_', '-'))},dueDateStatusValue=${#strings.toLowerCase(#strings.replace(task.dueDateStatus.name(), '_', '-'))}"
            th:data-task-id="${task.id}"
            th:data-due-date-status="${task.dueDateStatus}"
            th:classappend="'task-table-row--status_' + ${statusValue} + ' task-table-row--due_' + ${dueDateStatusValue}"
          >
            <td class="data-table__cell data-table__cell--align_center">
              <span
                class="task-table-row__handle js-sort-handle"
                title="ドラッグして並び替え"
                >≡</span
              >
            </td>
            <td class="data-table__cell">
              <span
                class="task-table-row__title js-task-title"
                th:text="${task.title}"
                >タイトルの表示位置</span
              >
              <p
                class="task-table-row__description"
                th:if="${task.description != null}"
                th:text="${task.description}"
              >
                詳細の表示位置
              </p>
            </td>
            <td class="data-table__cell">
              <span
                class="category-label"
                th:if="${task.category != null}"
                th:classappend="${task.category.color == null} ? 'category-label--no-color'"
              >
                <span
                  class="category-label__color"
                  aria-hidden="true"
                  th:style="${task.category.color != null} ? 'color: ' + ${task.category.color}"
                  >●</span
                >
                <span
                  class="category-label__name"
                  th:text="${task.category.name}"
                  >カテゴリ名の表示位置</span
                >
              </span>
            </td>
            <td class="data-table__cell data-table__cell--align_center">
              <span
                class="priority-badge"
                th:classappend="'priority-badge--level_' + ${#strings.toLowerCase(task.priority.name())}"
                th:text="${task.priority.displayName}"
              >
                中
              </span>
            </td>
            <td class="data-table__cell data-table__cell--align_center">
              <th:block th:if="${task.dueDate != null}">
                <span
                  class="task-table-row__due-date"
                  th:text="${#temporals.format(task.dueDate, 'yyyy/MM/dd')}"
                >
                  2026/09/30
                </span>
                <span class="task-table-row__overdue-label">期限切れ</span>
              </th:block>
            </td>
            <td class="data-table__cell data-table__cell--align_center">
              <select
                class="status-select js-status-select"
                th:classappend="'status-select--status_' + ${statusValue}"
                th:data-previous-status="${task.status}"
              >
                <option
                  th:each="s : ${statuses}"
                  th:value="${s}"
                  th:text="${s.displayName}"
                  th:selected="${s == task.status}"
                >
                  ステータス
                </option>
              </select>
            </td>
            <td class="data-table__cell data-table__cell--align_center">
              <a class="row-action" th:href="@{/tasks/{id}/edit(id=${task.id})}"
                >編集</a
              >
              <button
                type="button"
                class="row-action row-action--danger js-delete-button"
              >
                削除
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!--/*
      絞り込んだ後にJavaScriptがタスクの行を作るためのテンプレート。表の行を変えるときは、この行も同じ形に変える。
      状態のクラス、カテゴリ・詳細・期限の有無、ID、値はJavaScriptが入れる。
    */-->
    <template class="js-task-row-template">
      <tr class="task-table-row">
        <td class="data-table__cell data-table__cell--align_center">
          <span
            class="task-table-row__handle js-sort-handle"
            title="ドラッグして並び替え"
            >≡</span
          >
        </td>
        <td class="data-table__cell">
          <span class="task-table-row__title js-task-title"></span>
          <p class="task-table-row__description js-task-description"></p>
        </td>
        <td class="data-table__cell">
          <span class="category-label js-category-label">
            <span
              class="category-label__color js-category-color"
              aria-hidden="true"
              >●</span
            >
            <span class="category-label__name js-category-name"></span>
          </span>
        </td>
        <td
          class="data-table__cell data-table__cell--align_center js-priority-cell"
        ></td>
        <td class="data-table__cell data-table__cell--align_center">
          <span class="task-table-row__due-date js-due-date"></span>
          <span class="task-table-row__overdue-label js-overdue-label"
            >期限切れ</span
          >
        </td>
        <td class="data-table__cell data-table__cell--align_center">
          <select class="status-select js-status-select">
            <option
              th:each="s : ${statuses}"
              th:value="${s}"
              th:text="${s.displayName}"
            >
              ステータス
            </option>
          </select>
        </td>
        <td class="data-table__cell data-table__cell--align_center">
          <!--/* JavaScriptが、このURLの後ろに「/{id}/edit」を足す */-->
          <a class="row-action js-edit-link" th:href="@{/tasks}">編集</a>
          <button
            type="button"
            class="row-action row-action--danger js-delete-button"
          >
            削除
          </button>
        </td>
      </tr>
    </template>

    <!--/* 絞り込んだ後にJavaScriptが優先度のバッジを作るためのテンプレート。表示名を列挙型の1か所から取るため、JavaScriptはここから複製する */-->
    <template class="js-priority-badge-template">
      <span
        class="priority-badge js-priority-badge"
        th:each="p : ${priorities}"
        th:classappend="'priority-badge--level_' + ${#strings.toLowerCase(p.name())}"
        th:data-priority="${p}"
        th:text="${p.displayName}"
      >
        中
      </span>
    </template>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/jquery-ui/jquery-ui.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/list.js}"></script>
  </body>
</html>
