<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('タスク一覧', 'list.css')}"></head>
  <!-- JavaScriptからAPIを呼ぶ際にコンテキストパスが必要になるため、HTML側から渡す -->
  <body th:data-context-path="@{/}">
    <header th:replace="~{fragments/header :: appHeader}"></header>

    <h2>タスク一覧</h2>

    <p>
      <a class="button button-primary" th:href="@{/tasks/new}">タスク追加</a>
    </p>

    <p
      id="empty-message"
      class="empty-message"
      th:hidden="${!#lists.isEmpty(tasks)}"
    >
      タスクはありません
    </p>

    <table id="task-table" th:hidden="${#lists.isEmpty(tasks)}">
      <thead>
        <tr>
          <th>タイトル</th>
          <th>ステータス</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr
          th:each="task : ${tasks}"
          th:data-task-id="${task.id}"
          th:classappend="'status-' + ${task.status}"
        >
          <td class="task-title" th:text="${task.title}">タイトルの表示位置</td>
          <td>
            <select
              class="status-select"
              th:data-previous-status="${task.status}"
            >
              <option
                th:each="s : ${statuses}"
                th:value="${s}"
                th:text="${s.displayName}"
                th:selected="${s == task.status}"
              >
                ステータス
              </option>
            </select>
          </td>
          <td>
            <a class="row-action" th:href="@{/tasks/{id}/edit(id=${task.id})}"
              >編集</a
            >
            <button type="button" class="row-action delete-button">削除</button>
          </td>
        </tr>
      </tbody>
    </table>

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/js/list.js}"></script>
  </body>
</html>
